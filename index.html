<!-- Pan & Scroll Script -->
  <script>
    const viewport = document.getElementById('viewport');
    const container = document.getElementById('treeContainer');
    
    let scale = 1; // الحجم الطبيعي 100%
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    // ضبط الموضع في المنتصف عند فتح الصفحة
    window.addEventListener('load', () => {
      const viewportWidth = viewport.offsetWidth;
      const containerWidth = container.offsetWidth;
      pointX = (viewportWidth - containerWidth) / 2;
      pointY = 40;
      updateTransform();
    });

    function updateTransform() {
      container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // السحب والإفلات بالماوس (Drag & Drop)
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-card, a, button')) return;
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // تحريك الصفحة بالبكرة (Scroll instead of Zoom)
    viewport.addEventListener('wheel', (e) => {
      // إذا كان المستخدم يضغط على Ctrl، يتم التكبير/التصغير
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        scale = Math.min(Math.max(scale + delta, 0.4), 1.5);
        updateTransform();
      } else {
        // حركة طبيعية بالبكرة للأعلى والأسفل / اليمين واليسار
        e.preventDefault();
        if (e.shiftKey) {
          pointX -= e.deltaY; // تحريك أفقياً عند ضغط Shift
        } else {
          pointY -= e.deltaY; // تحريك رأسي عادي
        }
        updateTransform();
      }
    }, { passive: false });

    // أزرار التكبير والتصغير جانباً
    document.getElementById('zoomIn').addEventListener('click', () => {
      scale = Math.min(scale + 0.1, 1.5);
      updateTransform();
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale = Math.max(scale - 0.1, 0.4);
      updateTransform();
    });

    document.getElementById('zoomReset').addEventListener('click', () => {
      scale = 1;
      const viewportWidth = viewport.offsetWidth;
      const containerWidth = container.offsetWidth;
      pointX = (viewportWidth - containerWidth) / 2;
      pointY = 40;
      updateTransform();
    });
  </script>
